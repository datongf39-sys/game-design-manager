services:
  - type: web
    name: game-design-platform
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    disk:
      name: sqlite-db
      mountPath: /opt/render/project/src/backend_backup/db
      sizeGB: 1
